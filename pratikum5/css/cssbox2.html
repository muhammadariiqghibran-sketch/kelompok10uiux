<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .box-top {
        background-color: lightgreen;
        flex: 1;
        margin: 10px;
      }

      .first-row {
        margin: 10px;
        gap: 10px;
        flex: 2;
        display: flex;
        .box-left {
          background-color: yellow;
          flex: 1;
        }
        .box-right {
          background-color: red;
          flex: 6;
        }
      }
      .second-row {
        margin: 10px;
        gap: 10px;
        flex: 2;
        display: flex;
        .box-left {
          background-color: yellow;
          flex: 1;
        }
        .box-right {
          background-color: lightblue;
          flex: 6;
        }
      }

      .second-row {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="box-top"></div>
    <div class="first-row">
      <div class="box-left"></div>
      <div class="box-right"></div>
    </div>
    <div class="second-row">
      <div class="box-left"></div>
      <div class="box-right"></div>
    </div>
  </body>
</html>
